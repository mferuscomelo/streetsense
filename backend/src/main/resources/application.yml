spring:
  application:
    name: streetsense-backend
  threads:
    virtual:
      enabled: true # makes fork-per-subtask ingest (structured concurrency) cheap

server:
  port: 8080

management:
  endpoints:
    web:
      exposure:
        include: health

logging:
  level:
    root: INFO
    io.streetsense.backend: INFO # bump a single package to DEBUG at runtime, e.g. -Dlogging.level.io.streetsense.backend.ingest=DEBUG
  pattern:
    console: "%d{HH:mm:ss.SSS} %-5level [%X{requestId:--}] [%X{correlationId:--}] %logger{36} - %msg%n"
