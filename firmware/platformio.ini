; StreetSense firmware — Adafruit LED Glasses Driver, nRF52840 (product 5217)
; /firmware is deliberately C++, not Java — see the root README for why.

[env:ledglasses]
platform         = nordicnrf52
board            = adafruit_ledglasses_nrf52840
framework        = arduino
upload_protocol  = nrfutil
monitor_speed    = 115200
build_flags      = -DSTREETSENSE_MOCK=1
; Bluefruit BLE stack ships bundled with the Adafruit nRF52 Arduino core
; (framework package), so no separate lib_deps entry is needed for it.

; Host-side unit tests of the packet encoder — no board required.
; Proves sizeof/scaling/byte-order/golden-bytes without ever touching hardware.
[env:native]
platform         = native
test_framework   = unity
build_flags      = -DSTREETSENSE_HOST_TEST=1 -std=c++17
