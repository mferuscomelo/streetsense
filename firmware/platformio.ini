; StreetSense firmware — Adafruit LED Glasses Driver, nRF52840 (product 5217)
; /firmware is deliberately C++, not Java — see the root README for why.

; Default build: the mock sensor source. Every packet it emits carries
; FLAG_MOCK_DATA — the app shows a MOCK badge and the backend passes a `mock`
; field through every API response, so nothing downstream can present this
; as measured data.
;
; src/ holds only main.cpp; sensor sources live under lib/ as private
; libraries (PlatformIO's Library Dependency Finder resolves each one from
; the #include chain main.cpp actually reaches), so this env does not
; compile sen54_sensor_source at all — only mock_sensor_source is linked in.
[env:ledglasses]
platform         = nordicnrf52
board            = adafruit_ledglasses_nrf52840
framework        = arduino
upload_protocol  = nrfutil
monitor_speed    = 115200
build_flags      = -DSTREETSENSE_MOCK=1
; Bluefruit BLE stack and the PDM library both ship bundled with the Adafruit
; nRF52 Arduino core (framework package), so neither needs a lib_deps entry.
; The SEN5x driver and the MAX1704X fuel gauge driver are the third-party
; dependencies — Sensirion's and Adafruit's own drivers for their own
; hardware. See docs/attribution.md.
lib_deps         = sensirion/Sensirion I2C SEN5X@^0.3.0
                    adafruit/Adafruit MAX1704X@^1.0.3

; Real sensors: Sensirion SEN54 over STEMMA QT + the onboard PDM microphone,
; plus the MAX17048 battery fuel gauge (shares the same I2C bus at 0x36).
[env:ledglasses_sen54]
extends          = env:ledglasses
build_flags      =

; Host-side unit tests — no board required. Proves the packet encoder's
; sizeof/scaling/byte-order/golden-bytes, and the mock source's excursion
; behaviour, without ever touching hardware.
;
; src/ has nothing for this env to build (main.cpp needs Arduino/Bluefruit),
; so the LDF resolves test/test_*/'s #include chain straight into the
; relevant lib/ libraries (mock_sensor_source, sensor_source,
; streetsense_packet) — no build_src_filter needed.
[env:native]
platform         = native
test_framework   = unity
build_flags      = -DSTREETSENSE_HOST_TEST=1 -std=c++17
