; StreetSense firmware — Adafruit LED Glasses Driver, nRF52840 (product 5217)
; /firmware is deliberately C++, not Java — see the root README for why.

; Default build: the mock sensor source. The SEN54 is currently committed to
; another project, so this is what the node runs and what the demo shows.
; Every packet it emits carries FLAG_MOCK_DATA — the app shows a MOCK badge
; and the backend passes a `mock` field through every API response, so nothing
; downstream can present this as measured data.
;
; lib_deps is still needed here: sen54_sensor_source.cpp is compiled in every
; build (PlatformIO compiles all of src/), it's simply never instantiated.
[env:ledglasses]
platform         = nordicnrf52
board            = adafruit_ledglasses_nrf52840
framework        = arduino
upload_protocol  = nrfutil
monitor_speed    = 115200
build_flags      = -DSTREETSENSE_MOCK=1
; Bluefruit BLE stack and the PDM library both ship bundled with the Adafruit
; nRF52 Arduino core (framework package), so neither needs a lib_deps entry.
; The SEN5x driver is the one genuine third-party dependency — Sensirion's own
; BSD-3 driver for their own sensor. See docs/attribution.md.
lib_deps         = sensirion/Sensirion I2C SEN5X@^0.3.0

; Real sensors: Sensirion SEN54 over STEMMA QT + the onboard PDM microphone.
; Written, compiles, and never yet run against the physical sensor — treat it
; as unproven until someone has watched it on the serial monitor.
[env:ledglasses_sen54]
extends          = env:ledglasses
build_flags      =

; Host-side unit tests — no board required. Proves the packet encoder's
; sizeof/scaling/byte-order/golden-bytes, and the mock source's excursion
; behaviour, without ever touching hardware.
;
; build_src_filter pulls in exactly the one src/ file that has no Arduino
; dependency; main.cpp and sen54_sensor_source.cpp cannot compile natively.
[env:native]
platform         = native
test_framework   = unity
build_flags      = -DSTREETSENSE_HOST_TEST=1 -std=c++17
test_build_src   = yes
build_src_filter = -<*> +<mock_sensor_source.cpp>
